[project]
name = "chat-core"
version = "0.1.0"
description = "HexaChat core HTTP API: users, chats, message history, outbox publisher"
requires-python = "~=3.13.0"
dependencies = [
    "aiokafka[zstd]>=0.12",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "bcrypt>=4.2",
    "fastapi>=0.118",
    "hexachat-shared",
    "pydantic>=2.9",
    "pydantic-settings>=2.11",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.37",
    "uvloop>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
