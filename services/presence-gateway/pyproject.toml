[project]
name = "presence-gateway"
version = "0.1.0"
description = "HexaChat WebSocket gateway: presence + real-time fan-out"
requires-python = "~=3.13.0"
dependencies = [
    "aiokafka[zstd]>=0.12",
    "fastapi>=0.118",
    "hexachat-shared",
    "pydantic>=2.9",
    "pydantic-settings>=2.11",
    "redis>=5.0",
    "uvicorn[standard]>=0.37",
    "uvloop>=0.21",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
