[project]
name = "hexachat-shared"
version = "0.1.0"
description = "Cross-service contracts and helpers for HexaChat"
requires-python = "~=3.13.0"
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.9",
    "pyjwt>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hexachat_shared"]
